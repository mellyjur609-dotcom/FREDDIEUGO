<!DOCTYPE html><html><head><title>InriHack Booster Admin v2</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{font-family:system-ui;background:#0a0a0a;color:#fff;padding:15px} .card{background:#151515;border:1px solid #222;padding:18px;border-radius:14px;margin-bottom:18px} input,select,button{padding:12px;border-radius:10px;border:none;margin:4px} input,select{background:#232323;color:#fff} button{background:#00ff88;color:#000;font-weight:bold;cursor:pointer} button.red{background:#ff3b3b;color:#fff} button.yellow{background:#ffcc00} table{width:100%;border-collapse:collapse} th,td{padding:10px;border-bottom:1px solid #222;font-size:12px} .active{color:#00ff88} .suspended{color:#ff3b3b} small{color:#888}</style></head><body>
<h1>🔥 INRI BOOSTER v2 - ONLINE ADMIN</h1>
<div class="card"><h3>🟢 Server Status: <span id="status">Checking...</span></h3><p id="stats"></p></div>
<div class="card"><h3>Create Key (For Any Store)</h3><input id="customKey" placeholder="Custom key or random"><input id="validityValue" type="number" placeholder="Validity number"><select id="validityUnit"><option value="minutes">Minutes</option><option value="seconds">Seconds</option><option value="hours">Hours</option><option value="days">Days</option><option value="">Forever</option></select><button onclick="createKey()">GENERATE KEY</button></div>
<div class="card"><h3>All Keys Live <button onclick="loadKeys()">REFRESH</button></h3><div style="overflow-x:auto"><table id="keysTable"><thead><tr><th>Key</th><th>Device / HWID / App</th><th>Status</th><th>Expiry</th><th>Uses</th><th>Actions</th></tr></thead><tbody></tbody></table></div></div>
<script>
const API=''; async function checkHealth(){ try{ const r=await fetch(API+'/api/health'); const j=await r.json(); document.getElementById('status').innerText='ONLINE ✅'; document.getElementById('stats').innerText=`Total Keys: ${j.totalKeys} | Server: ${j.server}` }catch(e){ document.getElementById('status').innerText='OFFLINE ❌' } }
async function loadKeys(){ const res=await fetch(API+'/api/keys'); const keys=await res.json(); const tbody=document.querySelector('#keysTable tbody'); tbody.innerHTML=''; keys.forEach(k=>{ const expiry=k.expiresAt?new Date(k.expiresAt).toLocaleString():'Never'; const expired=k.expiresAt&&new Date(k.expiresAt)<new Date(); const tr=document.createElement('tr'); tr.innerHTML=`<td><b>${k.key}</b></td><td>${k.hwid?`${k.deviceName}<br><small>${k.hwid}<br>App: ${k.appId||'N/A'}<br>IP: ${k.ip||'N/A'}</small>`:'<i>Not used</i>'}</td><td class="${k.suspended||expired?'suspended':'active'}">${k.suspended?'SUSPENDED':expired?'EXPIRED':k.hwid?'ACTIVE':'UNUSED'}</td><td><small>${expiry}</small></td><td>${k.useCount||0}</td><td><button class="yellow" onclick="toggleSuspend('${k.key}',${!k.suspended})">${k.suspended?'UNBLOCK':'BLOCK'}</button><button onclick="resetHwid('${k.key}')">RESET</button><button class="red" onclick="deleteKey('${k.key}')">DEL</button></td>`; tbody.appendChild(tr); }); }
async function createKey(){ const customKey=document.getElementById('customKey').value; const validityValue=document.getElementById('validityValue').value; const validityUnit=document.getElementById('validityUnit').value; const res=await fetch(API+'/api/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customKey:customKey||undefined,validityValue:validityValue||undefined,validityUnit})}); const data=await res.json(); alert('Created: '+data.key.key); loadKeys(); }
async function deleteKey(key){ if(!confirm('Delete '+key+'?')) return; await fetch(API+'/api/keys/'+key,{method:'DELETE'}); loadKeys(); }
async function toggleSuspend(key,s){ await fetch(API+'/api/keys/'+key,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({suspended:s})}); loadKeys(); }
async function resetHwid(key){ await fetch(API+'/api/keys/'+key,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({resetHwid:true})}); loadKeys(); }
checkHealth(); loadKeys(); setInterval(()=>{checkHealth(); loadKeys();},5000);
</script></body></html>
